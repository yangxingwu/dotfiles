name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/go/bin
          key: macos-tools-bin-v1
      - name: Run bootstrap
        run: ./bootstrap-macos.sh
      - name: Add brew bash to PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Run integration tests
        run: bash tests/test_install.sh
      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-install-logs
          path: /tmp/dotfiles-*.log

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/cargo-cache
            /tmp/go-cache
          key: ubuntu-tools-bin-v1
      - name: Prepare cache dirs
        run: mkdir -p /tmp/cargo-cache /tmp/go-cache && chmod -R 777 /tmp/cargo-cache /tmp/go-cache
      - name: Build test image
        run: docker build -f tests/Dockerfile.ubuntu -t dotfiles-test-ubuntu .
      - name: Run integration tests
        run: |
          mkdir -p /tmp/dotfiles-logs
          docker run --rm \
            -v /tmp/cargo-cache:/home/testuser/.cargo \
            -v /tmp/go-cache:/home/testuser/go \
            -v /tmp/dotfiles-logs:/tmp \
            dotfiles-test-ubuntu
      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-install-logs
          path: /tmp/dotfiles-logs/dotfiles-*.log
      - name: Fix cache permissions
        if: always()
        run: sudo chmod -R a+r /tmp/cargo-cache /tmp/go-cache

  test-fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/cargo-cache
            /tmp/go-cache
          key: fedora-tools-bin-v1
      - name: Prepare cache dirs
        run: mkdir -p /tmp/cargo-cache /tmp/go-cache && chmod -R 777 /tmp/cargo-cache /tmp/go-cache
      - name: Build test image
        run: docker build -f tests/Dockerfile.fedora -t dotfiles-test-fedora .
      - name: Run integration tests
        run: |
          mkdir -p /tmp/dotfiles-logs
          docker run --rm \
            -v /tmp/cargo-cache:/home/testuser/.cargo \
            -v /tmp/go-cache:/home/testuser/go \
            -v /tmp/dotfiles-logs:/tmp \
            dotfiles-test-fedora
      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-install-logs
          path: /tmp/dotfiles-logs/dotfiles-*.log
      - name: Fix cache permissions
        if: always()
        run: sudo chmod -R a+r /tmp/cargo-cache /tmp/go-cache
